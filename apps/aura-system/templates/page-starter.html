<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zeus Aura Starter</title>
    <link rel="stylesheet" href="../styles/template.css" />
  </head>
  <body data-nav-root="../.." data-nav-current="">
    <div data-zeus-nav></div>

    <main>
      <section class="aura-hero">
        <div class="aura-container aura-hero__grid">
          <div class="aura-hero__copy">
            <span class="aura-tag">Starter</span>
            <h1 class="aura-title-xl">Start new pages from the shared Zeus visual system.</h1>
            <p class="aura-copy-lg">
              Replace this content and keep the layout, tokens, spacing, shadows,
              buttons, and card patterns.
            </p>
            <div class="aura-hero__actions">
              <a class="aura-button aura-button-primary" href="#">Primary action</a>
              <a class="aura-button aura-button-secondary" href="#">Secondary action</a>
            </div>
          </div>
          <div class="aura-card aura-hero__visual">
            <div class="aura-hero__mock"></div>
          </div>
        </div>
      </section>
    </main>
    <script src="../../../shared/zeus-nav.js"></script>
  </body>
</html>
